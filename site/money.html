<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content=noindex><title>الفلوس</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700&display=swap" rel=stylesheet><link rel=stylesheet href=sys.css></head><body><main id=app></main><script src=sys.js></script><script>
LP.ready((data,save)=>{
const {ar,$}=LP,f=n=>Number(n).toLocaleString('ar-EG');
data.money=data.money||['💍 مصاريف الجواز','🏠 بناء الدور اللي فوق','🛵 اسكوتر','🚗 العربية','🏢 مقدم شقة العاصمة','🧾 الأقساط','🚀 مشاريع مستقبلية'].map(n=>({n,t:0,s:0,d:''}));
function view(){const M=data.money,T=M.reduce((a,b)=>a+(+b.t||0),0),S=M.reduce((a,b)=>a+(+b.s||0),0),now=new Date();
$('#app').innerHTML=`<div class=hero><h1>💰 أهدافي المالية</h1><p>الأرقام بتتحفظ مشفّرة عندك. ملّي المستهدف والمدّخر وموعد كل هدف.</p><div class=stats><span>المستهدف: ${f(T)} ج.م</span><span>المدّخر: ${f(S)} ج.م</span><span>${ar(T?Math.round(S/T*100):0)}٪ تقدّم</span></div></div>
<div class=grid style="margin-top:14px">${M.map((g,i)=>{const r=Math.max(0,g.t-g.s),mo=g.d?(+g.d.slice(0,4)-now.getFullYear())*12+(+g.d.slice(5)-now.getMonth()-1):0;
return `<div class=card><div class=row><input data-i=${i} data-f=n value="${LP.esc(g.n)}" style="flex:1"><button class="btn g" data-x=${i}>✕</button></div><label class=m>المستهدف (ج.م)</label><input type=number data-i=${i} data-f=t value=${g.t}><label class=m>المدّخر (ج.م)</label><input type=number data-i=${i} data-f=s value=${g.s}><label class=m>الموعد</label><input type=month data-i=${i} data-f=d value="${g.d}">${g.d?`<p class=m>⏳ فاضل ${ar(Math.max(0,Math.ceil((new Date(g.d+'-01')-now)/864e5)))} يوم (${ar(Math.max(0,mo))} شهر)</p>`:''}<div class=bar style="margin:10px 0"><i style="width:${g.t?Math.min(100,g.s/g.t*100):0}%"></i></div><small>${!g.t?'اكتب المستهدف':r==0?'🎉 اتحقق':!g.d?`المتبقي ${f(r)} ج.م`:mo>0?`المتبقي ${f(r)} ج.م، يعني ${f(Math.ceil(r/mo))} ج.م كل شهر`:`المتبقي ${f(r)} ج.م والموعد عدّى`}</small></div>`}).join('')}</div><p><button class=btn id=ad>＋ هدف جديد</button></p>`;
document.querySelectorAll('[data-f]').forEach(e=>e.onchange=()=>{M[e.dataset.i][e.dataset.f]=e.dataset.f=='n'||e.dataset.f=='d'?e.value:+e.value;save();view()});
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{if(confirm('حذف الهدف؟')){M.splice(b.dataset.x,1);save();view()}});
$('#ad').onclick=()=>{M.push({n:'🎯 هدف جديد',t:0,s:0,d:''});save();view()}}
view()});
</script></body></html>
