<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content=noindex><title>Ahmed Plan</title>
<meta property="og:type" content="website"><meta property="og:title" content="Ahmed Plan"><meta property="og:description" content="انضباط وأهداف وبناء خطوة بخطوة"><meta property="og:image" content="https://nativemind11.github.io/ahmed_plan/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700&display=swap" rel=stylesheet><link rel=stylesheet href=sys.css></head><body ><main id=app></main><script src=sys.js></script><script>LP.ready(()=>{const ok=['index','phase1','phase2','phase3','phase4','investing','life','r'];
LP.$('#app').innerHTML='<div class=hero><h1>📥 استيراد صفحات الخطة</h1><p>اختار الـ٨ ملفات من فولدر private_pages. هتتخزن عندك في حسابك بس.</p></div><div class=card><input type=file id=fi accept=".html" multiple><div id=out style="margin-top:12px"></div></div>';
LP.$('#fi').onchange=async e=>{const o=LP.$('#out');o.innerHTML='';for(const f of e.target.files){const n=f.name.replace('.html','');const d=document.createElement('div');d.className='item';if(!ok.includes(n)){d.innerHTML='<span>⏭ '+LP.esc(f.name)+' اتخطّى (مش من صفحات الخطة)</span>';o.append(d);continue}try{await LP.setPage(n,await f.text());d.innerHTML='<span>✅ '+n+'</span>'}catch(x){d.innerHTML='<span>❌ '+n+': '+LP.esc(x.message)+'</span>'}o.append(d)}}});</script></body></html>
