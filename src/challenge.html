<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content=noindex><title>التحدي</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700&display=swap" rel=stylesheet><link rel=stylesheet href=sys.css></head><body><main id=app></main><script src=sys.js></script><script>
LP.ready((data,save)=>{
const {ymd,ar,$,esc}=LP;data.chh=data.chh||[];
const add=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
function view(){const c=data.ch,t=ymd(new Date());let h='<div class=hero><h1>🏆 تحدي ٣٠ يوم</h1><p>عادة واحدة، ٣٠ يوم ورا بعض. ابدأ صغير وكمّل.</p></div>';
if(!c)h+=`<div class=card><h3>ابدأ تحدي جديد</h3><input id=cn placeholder="مثلًا: أصحى ٦ الصبح كل يوم"><label class=m>تاريخ البداية</label><input type=date id=cs value=${t}><p><button class=btn id=st>🚀 ابدأ</button></p></div>`;
else{const ds=[...Array(30)].map((_,i)=>add(c.start,i)),n=ds.filter(d=>c.done[d]).length;
h+=`<div class=card><h3>${esc(c.name)}</h3><div class=bar><i style="width:${n/30*100}%"></i></div><p class=m>${ar(n)} من ٣٠ يوم (${ar(Math.round(n/30*100))}٪)</p><div class=vb style="grid-template-columns:repeat(auto-fill,minmax(64px,1fr))">${ds.map((d,i)=>`<button class="btn g ${d==t?'cur':''}" data-d=${d} ${d>t?'disabled':''} style="padding:10px 0;${c.done[d]?'background:var(--a);color:#07201c':''}">${c.done[d]?'✅':ar(i+1)}</button>`).join('')}</div><p class=row><button class=btn id=fin>🏁 احفظ في إنجازاتي</button><button class="btn g" id=can>إلغاء التحدي</button></p></div>`}
if(data.chh.length)h+=`<div class=card><h3>🏅 تحديات خلصتها</h3>${data.chh.map(x=>`<div class=item><span>${esc(x.name)}</span><small>بدأ ${x.start}، وخلّص ${ar(x.n)} من ٣٠ يوم</small></div>`).join('')}</div>`;
$('#app').innerHTML=h;
if($('#st'))$('#st').onclick=()=>{const n=$('#cn').value.trim();if(!n)return alert('اكتب اسم العادة');data.ch={name:n,start:$('#cs').value||t,done:{}};save();view()};
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const d=b.dataset.d;c.done[d]=!c.done[d];save();view()});
if($('#fin'))$('#fin').onclick=()=>{data.chh.push({name:c.name,start:c.start,n:Object.values(c.done).filter(Boolean).length});data.ch=null;save();view()};
if($('#can'))$('#can').onclick=()=>{if(confirm('إلغاء التحدي الحالي؟')){data.ch=null;save();view()}}}
view()});
</script></body></html>
