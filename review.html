<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content=noindex><title>التقييم</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700&display=swap" rel=stylesheet><link rel=stylesheet href=sys.css></head><body><main id=app></main><script src=sys.js></script><script>
LP.ready((data,save)=>{
const {ymd,ar,wk,$}=LP,q=new URLSearchParams(location.search);
data.rev=data.rev||{};data.days=data.days||{};data.log=data.log||[];data.tpl=data.tpl||[];
let tab=q.get('t')||'day',date=q.get('d')||ymd(new Date());
const T={day:'يومي',week:'أسبوعي',month:'شهري',quarter:'ربع سنوي',year:'سنوي'};
const idOf=(t,s)=>t=='day'?s:t=='week'?wk(s):t=='month'?s.slice(0,7):t=='year'?s.slice(0,4):s.slice(0,4)+'-Q'+(Math.floor((+s.slice(5,7)-1)/3)+1);
function view(){const id=idOf(tab,date),k=tab+':'+id,R=data.rev[k]=data.rev[k]||{s:5,w:'',m:'',l:'',f:''};
const ds=Object.keys(data.days).filter(x=>idOf(tab,x)==id),pc=ds.map(x=>{const d=data.days[x];return data.tpl.length?data.tpl.filter(g=>d.g[g.id]).length/data.tpl.length:0}),mo=ds.map(x=>data.days[x].mood).filter(Boolean),avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const past=Object.keys(data.rev).filter(x=>x.startsWith(tab+':')&&x!==k&&(data.rev[x].w||data.rev[x].l||data.rev[x].f)).sort().reverse();
$('#app').innerHTML=`<div class=hero><h1>📊 تقييم الأداء ${T[tab]}</h1><p>الفترة: ${id}</p><div class=stats><span>📅 ${ar(ds.length)} يوم متسجّل</span><span>✅ متوسط إنجاز الأهداف: ${ar(Math.round(avg(pc)*100))}٪</span><span>😊 متوسط المزاج: ${mo.length?ar(avg(mo).toFixed(1)):'—'} من ٥</span></div></div>
<div class=tabs>${Object.keys(T).map(t=>`<button class="btn g ${t==tab?'on':''}" data-t=${t}>${T[t]}</button>`).join('')}<input type=date id=dp value=${date} style="width:auto"></div>
<div class=card><h3>تقييمي من ١٠: <b id=sv>${ar(R.s)}</b></h3><input type=range min=1 max=10 id=sc value=${R.s}>
<h3>🏆 إيه اللي نجحت فيه؟</h3><textarea data-k=w>${R.w}</textarea><h3>⚠️ إيه اللي قصّرت فيه؟</h3><textarea data-k=m>${R.m}</textarea><h3>💡 اتعلمت إيه؟</h3><textarea data-k=l>${R.l}</textarea><h3>🎯 تركيزي الجاي</h3><textarea data-k=f>${R.f}</textarea></div>
${past.length?`<div class=card><h3>🕘 تقييمات سابقة</h3>${past.map(x=>`<div class=item><b>${x.split(':')[1]}</b><span>${ar(data.rev[x].s)}/١٠ — ${(data.rev[x].l||data.rev[x].w||data.rev[x].f).slice(0,90)}</span></div>`).join('')}</div>`:''}
<div class=card><h3>📝 سجل التغييرات في حياتي</h3><p class=m>أي قرار أو تغيير كبير عملته، اكتبه بتاريخه.</p><div class=row><input id=lg placeholder="مثلًا: بدأت أصحى ٦ الصبح" style="flex:1"><button class=btn id=al>إضافة</button></div><div id=ll></div></div>`;
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;view()});$('#dp').onchange=e=>{if(e.target.value){date=e.target.value;view()}};
$('#sc').oninput=e=>{R.s=+e.target.value;$('#sv').textContent=ar(R.s);save()};
document.querySelectorAll('[data-k]').forEach(t=>t.oninput=()=>{R[t.dataset.k]=t.value;save()});
const ll=()=>{$('#ll').innerHTML=data.log.map((l,i)=>`<div class=item><small>${l.d}</small><span>${l.t}</span><button class="btn g" data-x=${i}>✕</button></div>`).join('')};ll();
$('#al').onclick=()=>{const v=$('#lg').value.trim();if(v){data.log.unshift({d:ymd(new Date()),t:v});$('#lg').value='';save();ll()}};
$('#ll').onclick=e=>{const x=e.target.dataset.x;if(x!==undefined&&confirm('حذف؟')){data.log.splice(x,1);save();ll()}}}
view()});
</script></body></html>
